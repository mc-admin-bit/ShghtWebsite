<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            background: #2d2d2d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .login-container h2 {
            margin-top: 0;
            text-align: center;
            color: #fff;
        }

        .login-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #3a3a3a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        .login-container input:focus {
            outline: none;
            border-color: #007bff;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-container button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>用户登录</h2>
        <form id="login-form">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="输入用户名" required>

            <label for="password">密码</label>
            <input type="password" id="password" placeholder="输入密码" required>

            <button type="submit">登录</button>
            <div id="message"></div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageEl = document.getElementById('message');

            if (!username || !password) {
                messageEl.style.color = '#ff6b6b';
                messageEl.textContent = '请填写完整的用户名和密码';
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    messageEl.style.color = '#51cf66';
                    messageEl.textContent = '登录成功！正在跳转...';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    messageEl.style.color = '#ff6b6b';
                    messageEl.textContent = result.error || '登录失败，请检查用户名和密码';
                }
            } catch (error) {
                messageEl.style.color = '#ff6b6b';
                messageEl.textContent = '网络错误，请稍后重试';
            }
        });
    </script>
</body>

</html>
