<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            background: #2d2d2d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #fff;
        }

        .login-form {
            display: block;
        }

        .login-form label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #3a3a3a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-form button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .logout-section {
            display: none;
        }

        .logout-section p {
            font-size: 18px;
            color: #51cf66;
        }

        .logout-section button {
            padding: 12px 30px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-section button:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🔐 用户登录</h2>

        <!-- 登录表单 -->
        <div id="login-section" class="login-form">
            <form id="login-form">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="输入用户名" required>

                <label for="password">密码</label>
                <input type="password" id="password" placeholder="输入密码" required>

                <button type="submit">登录</button>
                <div id="message"></div>
            </form>
        </div>

        <!-- 已登录状态 -->
        <div id="logout-section" class="logout-section">
            <p>✅ 您已登录为 <span id="display-username"></span></p>
            <button id="logout-btn">登出</button>
        </div>
    </div>

    <script>
        // ---------- 检查登录状态 ----------
        async function checkLoginStatus() {
            try {
                const resp = await fetch('/api/me', {
                    credentials: 'same-origin'
                });
                const data = await resp.json();
                if (data.loggedIn) {
                    // 显示登出界面
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('logout-section').style.display = 'block';
                    document.getElementById('display-username').textContent = data.username;
                } else {
                    // 显示登录界面
                    document.getElementById('login-section').style.display = 'block';
                    document.getElementById('logout-section').style.display = 'none';
                }
            } catch (err) {
                // 网络错误时默认显示登录界面
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('logout-section').style.display = 'none';
            }
        }

        // ---------- 登录表单处理 ----------
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageEl = document.getElementById('message');

            if (!username || !password) {
                messageEl.style.color = '#ff6b6b';
                messageEl.textContent = '请填写完整的用户名和密码';
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    messageEl.style.color = '#51cf66';
                    messageEl.textContent = '✅ 登录成功！';
                    // 重新检查登录状态，刷新界面
                    checkLoginStatus();
                } else {
                    messageEl.style.color = '#ff6b6b';
                    messageEl.textContent = result.error || '❌ 登录失败';
                }
            } catch (error) {
                messageEl.style.color = '#ff6b6b';
                messageEl.textContent = '⚠️ 网络错误，请稍后重试';
            }
        });

        // ---------- 登出处理 ----------
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    // 登出成功，刷新状态
                    checkLoginStatus();
                } else {
                    alert('登出失败，请重试');
                }
            } catch (err) {
                alert('网络错误，请重试');
            }
        });

        // ---------- 页面加载时检查登录状态 ----------
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
</body>

</html>
